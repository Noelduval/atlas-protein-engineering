[project]
name = "atlas-protein-engineering"
version = "1.0.0"
description = "Mechanism-aware adaptive prioritization of experimentally untested DP622 mutation hypotheses."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "biopython>=1.85,<2",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dynamics = [
  "openmm>=8.2,<9",
  "pdbfixer @ git+https://github.com/openmm/pdbfixer.git@5e658a4fb8d2b90d65ca8408c845cbf104ce7099",
]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
]

[project.scripts]
atlas = "atlas.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
