[project]
name = "atlas-therapeutic-optimization"
version = "1.0.0"
description = "Validation-gated stability and catalytic-geometry screening for DP622 mutations."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "biopython>=1.85,<2",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dynamics = [
  "openmm>=8.2,<9",
]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
]

[project.scripts]
atlas = "atlas.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
